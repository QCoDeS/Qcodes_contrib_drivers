# Fixed measurement replies; acquisition sequencing is tested with mocks.
# The 60-3 resource provides IDN only for model/validator tests.
spec: '1.0'
devices:
  32-6:
    eom:
      GPIB INSTR:
        q: "\n"
        r: "\n"
    dialogues:
    - q: '*IDN?'
      r: KEITHLEY INSTRUMENTS,MODEL 2280S-32-6,SIM0001,01.07b
    - q: '*OPC?'
      r: '1'
    - q: :SYST:ERR?
      r: 0,"No error"
    - q: :MEAS:VOLT?
      r: '+5.000000E-02'
    - q: :MEAS:CURR?
      r: '+1.500000E-06'
    - q: :MEAS:CONC?
      r: +1.500000E-06,+5.000000E-02
    - q: '*TST?'
      r: '0'
    properties:
      source_voltage:
        default: 0.0
