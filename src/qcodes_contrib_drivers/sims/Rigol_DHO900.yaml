# pyvisa-sim model of a Rigol DHO914S for the QCoDeS driver RigolDHO900.
# Load with pyvisa_sim_file="qcodes_contrib_drivers.sims:Rigol_DHO900.yaml".
# Settings are stored and read back independently of each other; the responses copy
# the formats of a DHO914S with firmware 00.01.04. The waveform of every channel and
# mode is the same 1000-point WORD block: four periods of a 1 V sine over 1 ms.
# pyvisa-sim responses are text, so the block consists of printable bytes (low byte
# 'A', the sine in the high byte).
# The trigger status is always STOP, so that raw reads and digitize() complete.
spec: "1.1"

devices:
  dho900:
    eom:
      USB INSTR:
        q: "\n"
        r: "\n"
      TCPIP INSTR:
